# Build check: compiles PDF and Moore on GitHub's Windows servers on every push,
# so errors show up here and not on John's PC. Nothing is released here.
name: Build check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build PdfAndMoore/PdfAndMoore.csproj -c Release
