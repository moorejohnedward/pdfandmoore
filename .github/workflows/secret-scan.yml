# Secret scan: checks every commit in this repo's history for API keys, tokens and passwords.
# Runs on every push, every pull request and once a week. If it finds something it fails,
# and the log shows the file and line (the secret itself is hidden). If that happens:
# cancel the key where it was made FIRST, then remove it from the code.
# Uses the Gitleaks program directly (pinned version, fingerprint checked), so it works
# even with "Allow only GitHub-made actions" turned on.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * 1'   # Mondays 0623 Hawaii time

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # whole history, not just the latest commit

      - name: Install Gitleaks (pinned version, checksum checked)
        env:
          V: '8.30.1'
        run: |
          set -euo pipefail
          f="gitleaks_${V}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -fsSLO "$base/$f"
          curl -fsSL "$base/gitleaks_${V}_checksums.txt" | grep " ${f}\$" | sha256sum -c -
          tar xzf "$f" gitleaks
          ./gitleaks version

      - name: Scan every commit for keys and tokens
        run: ./gitleaks git --redact --no-banner --verbose .
